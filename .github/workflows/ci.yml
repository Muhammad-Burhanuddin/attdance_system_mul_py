name: Django CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install minimal dependencies for checks (incl. Celery)
        run: |
          pip install Django==5.1.6 daphne==4.1.2 channels==4.2.0 redis==5.2.1 PyYAML==6.0.2 requests==2.32.3 celery==5.4.0 django-celery-beat==2.7.0

      - name: Django checks
        env:
          DJANGO_SETTINGS_MODULE: attandance_app_mul.settings
          SECRET_KEY: dummy-ci-secret
          DEBUG: 'False'
        run: |
          python manage.py check --deploy
          python manage.py migrate --noinput


