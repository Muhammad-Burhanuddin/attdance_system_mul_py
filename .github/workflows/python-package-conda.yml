name: Python Package using Conda

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10]
      max-parallel: 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'
    
    - name: Add conda to system path
      run: echo $CONDA/bin >> $GITHUB_PATH
    
    - name: Install Mamba
      run: conda install -n base -c conda-forge mamba
    
    - name: Create Conda Environment
      run: mamba env create --file environment.yml --name myenv
    
    - name: Install dependencies
      run: mamba install -n myenv -c conda-forge flake8 pytest
    
    - name: Lint with flake8
      run: conda run -n myenv flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Test with pytest
      run: conda run -n myenv pytest --tb=short