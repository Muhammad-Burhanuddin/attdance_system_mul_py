<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Real-Time Attendance</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    #statusIndicator {
      font-weight: bold;
      color: green;
    }

    /* Styling for the loading indicator */
    #loadingIndicator {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
    }

    /* Device connection status section */
    .device-status {
      margin-top: 20px;
    }
    .device-status span {
      font-weight: bold;
    }
  </style>
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h2 class="mb-4 text-center">Real-Time Attendance</h2>
    
    <!-- Status Indicator -->
    <div id="statusIndicator" class="text-center mb-3">
      <span>Receiving data...</span>
    </div>

    <!-- Device Connection Status -->
    <div id="deviceStatus" class="device-status">
      <h5>Device Connection Status:</h5>
      <ul id="deviceStatusList"></ul>
    </div>

    <!-- Table -->
    <table class="table table-bordered">
      <thead class="table-dark">
        <tr>
          <th>Employee ID</th>
          <th>Employee Name</th>
          <th>Date/Time</th>
          <th>Device IP</th>
        </tr>
      </thead>
      <tbody id="realTimeAttendanceBody">
        <tr>
          <td colspan="4" class="text-center">Waiting for real-time updates...</td>
        </tr>
      </tbody>
    </table>
    
    <a href="/" class="btn btn-secondary">Back</a>
  </div>

  <!-- Circular Loading Indicator -->
  <div id="loadingIndicator" class="text-center">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <script>
    const socket = new WebSocket("ws://" + window.location.host + "/ws/real_time_attendance/");

    // WebSocket connection for status updates and real-time attendance
    socket.onmessage = function(event) {
        const message = JSON.parse(event.data);

        if (message.type === "update_connection_status") {
            updateConnectionStatus(message.host, message.status);
        }

        if (message.type === "update_attendance_data") {
            updateAttendanceTable(message.data);
        }
    };

    function updateConnectionStatus(host, status) {
        const statusList = document.getElementById("deviceStatusList");
        let statusItem = document.getElementById(`device-${host}`);

        if (!statusItem) {
            statusItem = document.createElement("li");
            statusItem.id = `device-${host}`;
            statusList.appendChild(statusItem);
        }

        statusItem.innerHTML = `${host}: <span style="color: ${status === 'connected' ? 'green' : 'red'};">${status}</span>`;
    }

    function updateAttendanceTable(data) {
        const tableBody = document.getElementById("realTimeAttendanceBody");
        const newRow = document.createElement("tr");

        newRow.innerHTML = `
          <td>${data.employee_id}</td>
          <td>${data.employee_name}</td>
          <td>${data.date_time}</td>
          <td>${data.device_ip}</td>
        `;
        tableBody.prepend(newRow);
    }

    socket.onclose = function(event) {
        console.log("WebSocket closed:", event);
        document.getElementById("statusIndicator").innerHTML = "<span style='color: red;'>Connection lost. Reconnecting...</span>";
    };

    function refreshAttendance() {
        document.getElementById("loadingIndicator").style.display = "block";
        setTimeout(() => {
            document.getElementById("loadingIndicator").style.display = "none";
            console.log("Refreshing attendance data...");
        }, 2000); // Simulating data fetching delay
    }

    setInterval(function() {
        refreshAttendance();
    }, 5000); // 5 seconds interval
  </script>
</body>
</html>
