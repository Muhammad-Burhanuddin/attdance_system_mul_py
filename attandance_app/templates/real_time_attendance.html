<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Real-Time Attendance</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    #statusIndicator {
      font-weight: bold;
      color: green;
    }
  </style>
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="m-0">Real-Time Attendance</h2>
      <div>
        <a href="/devices/" class="btn btn-outline-primary">Devices</a>
      </div>
    </div>
    
    <!-- Device Selection -->
    <div class="row mb-3">
      <div class="col-md-6">
        <label for="deviceSelect" class="form-label">Select Device IP</label>
        <select id="deviceSelect" class="form-select">
          <option value="">-- Select Device --</option>
          {% for device in devices %}
            <option value="{{ device.host }}" data-port="{{ device.port }}">
              {{ device.host }} (Port: {{ device.port }})
            </option>
          {% endfor %}
        </select>
        
      </div>
      <div class="col-md-6">
        <label for="port" class="form-label">Port</label>
        <input type="text" id="port" class="form-control" placeholder="Port" readonly>
      </div>
    </div>

    <!-- Status Indicator -->
    <div id="statusIndicator" class="text-center mb-3">
      <span>Receiving data...</span>
    </div>

    <!-- Device Connection Status -->
    <div id="deviceStatus" class="mb-3">
      <h5>Device Connection Status:</h5>
      <ul id="deviceStatusList"></ul>
    </div>

    <!-- Attendance Table -->
    <table class="table table-bordered">
      <thead class="table-dark">
        <tr>
          <th>Employee ID</th>
          <th>Employee Name</th>
          <th>Date/Time</th>
          <th>Device IP</th>
        </tr>
      </thead>
      <tbody id="realTimeAttendanceBody">
        <tr>
          <td colspan="4" class="text-center">Waiting for real-time updates...</td>
        </tr>
      </tbody>
    </table>
    
    <a href="/devices/" class="btn btn-secondary">Back</a>
  </div>

  <script>
    // List of configured devices injected from server for initial status seeding
    const __configuredDevices = [
      {% for device in devices %}
        { host: "{{ device.host }}", port: {{ device.port }} },
      {% endfor %}
    ];

    function seedDeviceStatus(placeText) {
      const statusList = document.getElementById("deviceStatusList");
      statusList.innerHTML = "";
      __configuredDevices.forEach(function(d){
        const li = document.createElement("li");
        li.id = `device-${d.host}`;
        li.innerHTML = `${d.host}: <span style="color: orange;">${placeText}</span>`;
        statusList.appendChild(li);
      });
    }

    function getStatusMap() {
      try {
        return JSON.parse(localStorage.getItem('deviceStatusMap') || '{}');
      } catch (e) {
        return {};
      }
    }

    function setStatus(host, status) {
      const map = getStatusMap();
      map[host] = status;
      localStorage.setItem('deviceStatusMap', JSON.stringify(map));
    }

    function checkAndEnsureConnections(devices) {
      devices.forEach(function(d){
        updateConnectionStatus(d.host, 'checking...');
        $.getJSON('/start_device/', { ip: d.host, port: d.port })
          .done(function(resp){
            if (resp && resp.status === 'already_running') {
              updateConnectionStatus(d.host, 'connected');
              setStatus(d.host, 'connected');
            } else if (resp && resp.status === 'started') {
              updateConnectionStatus(d.host, 'connecting...');
              setStatus(d.host, 'connecting');
            } else {
              updateConnectionStatus(d.host, 'failed');
              setStatus(d.host, 'failed');
            }
          })
          .fail(function(){
            updateConnectionStatus(d.host, 'failed');
            setStatus(d.host, 'failed');
          });
      });
    }

    function initRealTimePage() {
      // Show initial status placeholders immediately
      seedDeviceStatus('checking...');

      // On each load/refresh, actively check and ensure connection status per device
      checkAndEnsureConnections(__configuredDevices);

      $('#deviceSelect').on('change', function() {
        var port = $(this).find(':selected').data('port');
        $('#port').val(port || '');

        var ip = $(this).val();
        if (ip && port) {
          // Show immediate UI feedback
          updateConnectionStatus(ip, 'connecting...');
          // Kick off device connection on the server (non-blocking)
          $.get('/start_device/', { ip: ip, port: port })
            .fail(function(xhr) {
              updateConnectionStatus(ip, 'failed');
              console.error('Failed to start device', xhr.responseText);
            });
        }
      });

      // Open WebSocket once per lifecycle
      if (!window.__rt_socket) {
        const socket = new WebSocket((window.location.protocol === "https:" ? "wss://" : "ws://") + window.location.host + "/ws/real_time_attendance/");
        window.__rt_socket = socket;

        socket.onmessage = function(event) {
          const message = JSON.parse(event.data);

          if (message.type === "update_connection_status") {
            updateConnectionStatus(message.host, message.status);
            setStatus(message.host, message.status);
          }

          if (message.type === "update_attendance_data") {
            updateAttendanceTable(message.data);
          }
        };

        socket.onclose = function(event) {
          document.getElementById("statusIndicator").innerHTML = "<span style='color: red;'>Connection lost. Reconnecting...</span>";
          // Allow reinit on next foreground visit
          window.__rt_socket = null;
          // Re-check connections shortly after socket closes
          setTimeout(function(){ checkAndEnsureConnections(__configuredDevices); }, 1000);
        };
      }
    }

    // First load
    $(document).ready(function() {
      if (!window.__rt_initialized) {
        initRealTimePage();
        window.__rt_initialized = true;
      }
    });

    // If page is restored from bfcache, DOM/state persists; avoid reinit
    window.addEventListener('pageshow', function(e) {
      // On browser back-forward cache restore or normal show, ensure devices are (re)started
      seedDeviceStatus('checking...');
      checkAndEnsureConnections(__configuredDevices);
      if (!window.__rt_socket) {
        initRealTimePage();
      }
    });

    function updateConnectionStatus(host, status) {
        const statusList = document.getElementById("deviceStatusList");
        let statusItem = document.getElementById(`device-${host}`);

        if (!statusItem) {
            statusItem = document.createElement("li");
            statusItem.id = `device-${host}`;
            statusList.appendChild(statusItem);
        }

        statusItem.innerHTML = `${host}: <span style="color: ${status === 'connected' ? 'green' : 'red'};">${status}</span>`;
    }

    function updateAttendanceTable(data) {
        const tableBody = document.getElementById("realTimeAttendanceBody");
        const newRow = document.createElement("tr");

        newRow.innerHTML = `
          <td>${data.employee_id}</td>
          <td>${data.employee_name}</td>
          <td>${data.date_time}</td>
          <td>${data.device_ip}</td>
        `;
        tableBody.prepend(newRow);
    }

  </script>
</body>
</html>
